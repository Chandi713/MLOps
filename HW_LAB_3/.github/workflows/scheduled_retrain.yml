# Scheduled Model Retraining - Runs after train_on_push completes
name: Scheduled Model Retraining

on:
  # Trigger when train_on_push.yml completes
  workflow_run:
    workflows: ["Train Model on Push"]
    types:
      - completed
    branches: [HW-LAB-3]
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Only run if triggered manually OR if train_on_push succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: HW-LAB-3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Get pip cache dir
      id: pip-cache-dir
      run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate timestamp
      id: timestamp
      run: |
        timestamp=$(date '+%Y%m%d%H%M%S')
        echo "ts=$timestamp" >> $GITHUB_OUTPUT

    - name: Retrain models with different degrees
      run: |
        for degree in 2 5 9; do
          echo "Training model with degree $degree..."
          python src/train_cli.py --points 100 --degree $degree --timestamp ${{ steps.timestamp.outputs.ts }}_deg${degree} --evaluate
        done

    - name: Upload models
      uses: actions/upload-artifact@v3
      with:
        name: retrained-models-${{ steps.timestamp.outputs.ts }}
        path: models/

    - name: Upload metrics
      uses: actions/upload-artifact@v3
      with:
        name: retrain-metrics-${{ steps.timestamp.outputs.ts }}
        path: metrics/

    - name: Commit retrained models
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add models/ metrics/ || true
        git diff --cached --quiet || git commit -m "🔄 Scheduled retraining ${{ steps.timestamp.outputs.ts }}"
        git push || echo "Nothing to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify on success
      if: success()
      run: echo "✅ Scheduled retraining completed successfully"

    - name: Notify on failure
      if: failure()
      run: echo "❌ Scheduled retraining failed"
